<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Edit profile</h1>
    <button><a href="/">index</a></button>
    <form method="post">
        {% csrf_token %}
        <label>username</label>
        <input type="text" name="username" value="{{user.username}}"><br>
        <label>Stud_name</label>
        <input type="text" name="stud_name" value="{{user.stud_name}}"><br>
        <label>phone_no</label>
        <input type="number" name="phone_no"value="{{user.phone_no}}" ><br>
        <label>Address</label>
        <input type="text" name="address" value="{{user.address}}"><br>
        <label>Email</label>
        <input type="email" name="email" value="{{user.email}}"><br>
        <label>Location</label>
        <input type="text" name="location" value="{{user.location}}"><br>
        <label>Website_link</label> 
        <input type="text" name="website_link" value="{{user.website_link}}"><br>
        <label>Work_experience</label>
        <input type="text" name="work_experience" value="{{user.work_experience}}">
        <button><input type="Submit" value="Edit"></button>
    </form>
</body>
</html>
